<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layer"></div>
    <div class="ariing-background">
      <div class="aav">
        <div class="korea"></div>
        <div class="quote">
          <div class="umrah">
            <h2>Get Umrah Quote</h2>
          </div>
          <div class="package">
            <h5>All-inclusive Umrah Package</h5>
          </div>
          <div class="passenger">
            <h5>Lead Passenger Name:</h5>
          </div>
          <div class="grey-border">
            <div class="name-ali">
              <h6>Mohammad Ali</h6>
            </div>
          </div>
          <div class="number">
            <h5>Enter Avtive Number:</h5>
          </div>
          <div class="number-border">
            <div class="example-numbers">
              <h6>+44 203 123 4567</h6>
            </div>
          </div>
          <div class="email">
            <h5>Enter Email:</h5>
          </div>
          <div class="email-border">
            <div class="example-email">
              <h6>myemail@gmail.com</h6>
            </div>
          </div>
          <div class="total-passengers">
            <h5>Total Passengers:</h5>
          </div>
          <div class="passenger-border">
            <div class="example-people">
              <h6><span>i.e 2 adults & 2 kid</span></h6>
            </div>
          </div>
          <div class="policy">
            <h5>I accept the<span> Privacy Policy</span></h5>
            <div class="grey-button"></div>
          </div>
          <button class="submit-button">Submit</button>
        </div>
      </div>
    </div>
  </body>
</html>
